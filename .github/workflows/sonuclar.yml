name: Sonuçları güncelle
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["robot/**", ".github/workflows/sonuclar.yml"]
permissions:
  contents: write
concurrency:
  group: sonuclar
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.48.0
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python robot/sonuc_robot.py
      - name: Değiştiyse kaydet
        run: |
          if [ -n "$(git status --porcelain veri)" ]; then
            git config user.name "toto-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add veri && git commit -qm "Sonuçlar güncellendi" && (git push || (git pull --rebase -q && git push))
          fi
