name: Oran tanı
on:
  push:
    branches: [tani-oran]
    paths: ["tani/**", ".github/workflows/tani.yml"]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tani/calistir.py
      - run: |
          git config user.name toto-robot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tani/sonuc.json && git commit -qm "tanı sonucu" && git push origin HEAD:tani-oran
