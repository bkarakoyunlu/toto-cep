<style>
/* Layout: tek sütun telefon uygulaması — üstte hafta çubuğu, ortada kartlar, altta sabit sekme çubuğu (Takip · Kolonlar · Arşiv) */
:root{
  --bg:#f1f4f2; --panel:#ffffff; --panel2:#f6f9f7; --ink:#14201c; --muted:#5b6a64; --line:#dce4e0;
  --hdr:#0f2a24; --hdr-ink:#e8f3ef; --accent:#0d7a5f; --accent-ink:#ffffff; --accent-soft:#e0f2eb;
  --ok:#0d7a5f; --ok-soft:#dcf2e6; --bad:#b4232c; --bad-soft:#fbe6e7; --warn:#a85d06; --warn-soft:#fdf1df;
  --c1:#1f5fd1; --cx:#a86e14; --c2:#c0354a; --c1s:#e6eefc; --cxs:#fbf0dc; --c2s:#fbe6ea;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --panel:#151f1c; --panel2:#1a2623; --ink:#e4ece9; --muted:#93a39d; --line:#26342f;
  --hdr:#08110e; --hdr-ink:#e4ece9; --accent:#2fb38c; --accent-ink:#06120e; --accent-soft:#163a30;
  --ok:#3cc596; --ok-soft:#14352a; --bad:#f07a82; --bad-soft:#3d1c1f; --warn:#e8aa47; --warn-soft:#3a2c14;
  --c1:#7aa6f7; --cx:#e3ab47; --c2:#f2869a; --c1s:#1b2a45; --cxs:#3a2d14; --c2s:#41202a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --panel:#151f1c; --panel2:#1a2623; --ink:#e4ece9; --muted:#93a39d; --line:#26342f;
  --hdr:#08110e; --hdr-ink:#e4ece9; --accent:#2fb38c; --accent-ink:#06120e; --accent-soft:#163a30;
  --ok:#3cc596; --ok-soft:#14352a; --bad:#f07a82; --bad-soft:#3d1c1f; --warn:#e8aa47; --warn-soft:#3a2c14;
  --c1:#7aa6f7; --cx:#e3ab47; --c2:#f2869a; --c1s:#1b2a45; --cxs:#3a2d14; --c2s:#41202a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button,input,select{font:inherit;color:inherit}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink);
  padding-block:10px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr .r{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;letter-spacing:.01em}
.logo i{display:inline-block;width:8px;height:8px;border-radius:2px}
.hdr select{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--hdr-ink);border-radius:9px;padding:7px 8px;font-size:14px}
.hdr select option{color:#111;background:#fff}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:var(--hdr-ink);border-radius:9px;padding:7px 11px;font-size:14px;font-weight:600;white-space:nowrap}
.alt{font-size:12px;opacity:.75;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
main{padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-wrap:balance}
.card h2 .s{font-size:12px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.sb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tiles4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tiles4 .tile{text-align:center;padding:8px 4px}.tiles4 .v{font-size:19px}
.tile{background:var(--panel2);border-radius:10px;padding:8px 10px;min-width:0}
.tile .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted)}
.tile.ok{background:var(--ok-soft)} .tile.ok .v{color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;border-radius:6px;padding:0 5px;font-weight:800;font-size:13px}
.k1{background:var(--c1s);color:var(--c1)} .kX{background:var(--cxs);color:var(--cx)} .k2{background:var(--c2s);color:var(--c2)}
.mac{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mac:first-of-type{border-top:0}
.mac .no{color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.mac .ad{min-width:0} .mac .ad>b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:5px;background:var(--line)}
.bar i{display:block;height:100%}
.sbs{display:flex;gap:4px}
.sb{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:800;cursor:pointer}
.sb.on.s1{background:var(--c1);border-color:var(--c1);color:#fff}.sb.on.sX{background:var(--cx);border-color:var(--cx);color:#fff}.et td,.et th{padding:5px 2px}.sb.dn{outline:2px dashed var(--ink);outline-offset:-5px}.sb.on.s2{background:var(--c2);border-color:var(--c2);color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;width:100%}
th,td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
td.h{width:22px;height:24px;font-weight:700;font-family:var(--mono);font-size:12px}
td.d{background:var(--ok-soft);color:var(--ok)} td.y{background:var(--bad-soft);color:var(--bad)}
.note{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--panel2);border:1px solid var(--line)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--panel);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 10px;font-size:15px;color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:90%}
.pill{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mut{background:var(--panel2);color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .m{flex:1;min-width:0}
@media (prefers-reduced-motion:no-preference){.sheet .in{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<body>
<header class="hdr">
  <div class="r">
    <div class="logo"><i style="background:var(--c1)"></i><i style="background:var(--cx)"></i><i style="background:var(--c2)"></i>Toto Cep</div>
    <select id="haftaSec" aria-label="Hafta"></select>
    <button class="hbtn" id="yenileBtn" aria-label="Yenile">⟳</button><button class="hbtn" id="ayarBtn" aria-label="Erişimler">⚙</button>
  </div>
  <div class="alt" id="alt"></div>
</header>

<main id="ana"></main>

<nav class="tabbar" aria-label="Bölümler">
  <button class="tab" data-t="takip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Takip</button>
  <button class="tab" data-t="ihtimal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>İhtimaller</button>
  <button class="tab" data-t="kolon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>Kolonlar</button>
  <button class="tab" data-t="arsiv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v13H4zM2 3h20v4H2zM10 12h4"/></svg>Arşiv</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tl=n=>n==null||!isFinite(n)?"—":Number(n).toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2})+" ₺";
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const KF=10, O="1X2";
let W={},AKTIF=ls("cepHafta")||null,SEKME=ls("cepSekme")||"takip",KSEC=ls("cepKupon")||"hepsi",FILTRE="hepsi",ARA="";
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.z);toast.z=setTimeout(()=>e.hidden=true,2600)}

/* ---------- erişim: kişiye özel bağlantı = dosya kimliği + şifre (adresin # kısmında, sunucuya hiç gitmez) */
const ERK="totoErisim";
function erisimler(){try{return JSON.parse(ls(ERK)||"[]")||[]}catch(e){return []}}
function erisimKaydet(L){ls(ERK,JSON.stringify(L))}
function erisimCoz(metin){const m=String(metin||"").trim().match(/([a-f0-9]{12,32})-([A-Za-z0-9]{16,64})\s*$/);return m?{id:m[1],k:m[2]}:null}
function erisimEkle(e){const L=erisimler();if(!L.find(x=>x.id===e.id)){L.push(e);erisimKaydet(L);return true}return false}
function erisimSorun(e){return e.durum==="sifre"?`${e.ad||"Bir bağlantı"}: şifre geçersiz (bağlantı yenilenmiş olabilir).`:e.durum==="yok"?`${e.ad||"Bir bağlantı"}: kolon dosyası bulunamadı (henüz yayınlanmamış ya da bağlantı yenilenmiş).`:e.durum==="hata"?`${e.ad||"Bir bağlantı"}: okunamadı, internet bağlantını kontrol et.`:""}

/* ---------- şifre çözme: PBKDF2-SHA256 → (şifreleme anahtarı, doğrulama anahtarı); HMAC-SHA256 sayaç akışı + HMAC etiketi */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function bitis(...a){const o=new Uint8Array(a.reduce((x,y)=>x+y.length,0));let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o}
async function coz(obj,sifre){
  if(!crypto||!crypto.subtle)throw new Error("tarayici");
  const salt=b64(obj.salt),iv=b64(obj.iv),ct=b64(obj.ct),tag=b64(obj.tag),S=crypto.subtle;
  const ana=await S.importKey("raw",new TextEncoder().encode(sifre),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await S.deriveBits({name:"PBKDF2",salt,iterations:obj.iter,hash:"SHA-256"},ana,512));
  const kE=await S.importKey("raw",bits.slice(0,32),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const kM=await S.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  if(!await S.verify("HMAC",kM,tag,bitis(salt,iv,ct)))throw new Error("sifre");
  const n=Math.ceil(ct.length/32),ks=new Uint8Array(n*32);
  for(let b=0;b<n;b+=256){const P=[];for(let i=b;i<Math.min(n,b+256);i++){const m=new Uint8Array(20);m.set(iv);new DataView(m.buffer).setUint32(16,i);P.push(S.sign("HMAC",kE,m).then(x=>ks.set(new Uint8Array(x),i*32)))}await Promise.all(P)}
  const pt=new Uint8Array(ct.length);for(let i=0;i<ct.length;i++)pt[i]=ct[i]^ks[i];
  return JSON.parse(new TextDecoder().decode(pt))}

/* ---------- veri: herkese açık sonuçlar + şifreli ekip dosyaları */
let SON=null,VERI={},YUKLENIYOR=false,SONHATA=null,KONTROL=null;
async function al(yol){const r=await fetch(yol+"?t="+Date.now(),{cache:"no-store"});if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}return r.json()}
function siraOf(ar){const m=String(ar||"").match(/(\d{2})\.(\d{2})\.(\d{4})/);return m?+(m[3]+m[2]+m[1]):0}
async function yenile(sessiz){
  if(YUKLENIYOR)return;YUKLENIYOR=true;if(!sessiz)ciz();
  const L=erisimler();let hata=null;
  try{SON=await al("veri/sonuclar.json")}catch(e){if(!SON)SON={haftalar:{}};hata="Sonuçlar şu an alınamadı."}
  await Promise.all(L.map(async e=>{try{const d=await coz(await al("veri/e/"+e.id+".json"),e.k);VERI[e.id]=d;e.ad=d.baslik||e.ad;e.yayin=d.yayin;e.durum="ok"}
    catch(err){e.durum=err.status===404?"yok":err.message==="sifre"?"sifre":"hata";if(err.status===404||err.message==="sifre")delete VERI[e.id]}}));
  erisimKaydet(L);KONTROL=new Date();
  const eski=JSON.stringify(W);W=kur();YUKLENIYOR=false;SONHATA=hata;
  if(!sessiz||JSON.stringify(W)!==eski)ciz();else $("#alt").innerHTML=altSatir();
}
/* Nesine bazen programın adını değiştirir (ör. bir maç ertelenince "23.10 - 26.10" -> "23.10 - 27.10").
   Aynı gün başlayan programlardan en son güncelleneni kullanılır. */
function sonucBul(ar){const H=(SON&&SON.haftalar)||{};if(!ar)return null;const bas=String(ar).slice(0,10);
  const aday=Object.entries(H).filter(([k])=>k===ar||k.slice(0,10)===bas).map(([,v])=>v);
  return aday.sort((a,b)=>String(b.guncel||"").localeCompare(String(a.guncel||"")))[0]||null}
function kur(){const W2={};
  Object.values(VERI).forEach(d=>(d.haftalar||[]).forEach(h=>{const id=h.aralik||h.ad;if(!id)return;
    const w=W2[id]=W2[id]||{id,ad:h.aralik||h.ad,aralik:h.aralik||"",maclar:h.maclar||[],kuponlar:[],sira:siraOf(h.aralik)||0,yS:h.sonuclar,yI:h.ikramiye};
    (h.kuponlar||[]).forEach(k=>{if(!w.kuponlar.find(x=>x.ad===k.ad))w.kuponlar.push({ad:k.ad||"Kupon",kolonlar:(k.kolonlar||[]).filter(c=>/^[1X2]{15}$/.test(c))})})}));
  Object.values(W2).forEach(w=>{const r=sonucBul(w.aralik);
    if(r&&r.maclar&&r.maclar.length>=15){w.sonuclar=r.maclar.slice(0,15).map(m=>m.sonuc||null);w.durum=r.maclar.map(m=>m.durum||"");w.tarih=r.maclar.map(m=>m.tarih||"");
      w.ikramiye={};(r.ikramiye||[]).forEach(x=>{w.ikramiye[x.bilen]=x.kazanc});w.guncel=r.guncel}
    else{w.sonuclar=Array.from({length:15},(_,i)=>(w.yS||[])[i]||null);w.ikramiye=w.yI||{}}
    delete w.yS;delete w.yI;
    if(!w.maclar.some(Boolean)&&r)w.maclar=r.maclar.map(m=>m.ad)});
  return W2}
function saat(d){return d?d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):""}
function durumMetni(){const w=hafta();const sorun=erisimler().filter(e=>e.durum&&e.durum!=="ok").length;
  return YUKLENIYOR?"güncelleniyor…":SONHATA?SONHATA:[w&&w.guncel?`sonuç: ${w.guncel.slice(11)}`:"",KONTROL?`kontrol ${saat(KONTROL)}`:"",sorun?`⚠ ${sorun} bağlantı sorunlu`:""].filter(Boolean).join(" · ")}
function altSatir(){const w=hafta();return w?`<span>${esc(w.aralik||"")}</span><span>${kuponlar(w).length} ekip · ${kuponlar(w).reduce((a,k)=>a+k.kolonlar.length,0)} kolon</span><span>${durumMetni()}</span>`:`<span>${durumMetni()}</span>`}
function macDurum(w,i){const d=(w.durum||[])[i]||"",t=(w.tarih||[])[i]||"";return esc(d?d.replace(" / "," · "):t?t:"")}

/* ---------- hesaplar */
function hafta(){return AKTIF&&W[AKTIF]||null}
function kuponlar(w){return w.kuponlar||[]}
function secili(w){const K=kuponlar(w);return KSEC==="hepsi"||!K.find(k=>k.ad===KSEC)?K:K.filter(k=>k.ad===KSEC)}
function kolonOz(c,son){let d=0,y=0;for(let i=0;i<15;i++){if(son[i]){c[i]===son[i]?d++:y++}}return {d,y,tavan:15-y}}
function ozet(K,son){const biten=son.filter(Boolean).length;let n=0,en=0,t12=0,t13=0,bilen={};
  K.forEach(k=>k.kolonlar.forEach(c=>{n++;const o=kolonOz(c,son);en=Math.max(en,o.d);if(o.tavan>=12)t12++;if(o.tavan>=13)t13++;if(biten===15&&o.d>=12)bilen[o.d]=(bilen[o.d]||0)+1}));
  return {n,biten,en,t12,t13,bilen,tavan:Math.max(0,...K.flatMap(k=>k.kolonlar.map(c=>kolonOz(c,son).tavan)))}}
function kazanc(w,bilen){const ik=w.ikramiye||{};if(!Object.keys(ik).length)return null;let t=0;Object.entries(bilen).forEach(([b,n])=>{if(ik[b]!=null&&ik[b]!=="")t+=n*Number(ik[b])});return t}

/* ---------- çizim */
function ciz(){
  const sel=$("#haftaSec");const ids=Object.keys(W).sort((a,b)=>(W[b].sira||0)-(W[a].sira||0));
  if(AKTIF&&!W[AKTIF])AKTIF=null;if(!AKTIF&&ids.length)AKTIF=ids[0];
  sel.innerHTML=ids.length?ids.map(id=>`<option value="${esc(id)}" ${id===AKTIF?"selected":""}>${esc(W[id].ad||W[id].aralik||"Hafta")}</option>`).join(""):'<option>Hafta yok</option>';
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===SEKME));
  const w=hafta();
  $("#alt").innerHTML=w?`<span>${esc(w.aralik||"")}</span><span>${kuponlar(w).length} ekip · ${kuponlar(w).reduce((a,k)=>a+k.kolonlar.length,0)} kolon</span><span>${durumMetni()}</span>`:`<span>${durumMetni()}</span>`;
  const a=$("#ana");
  if(!w){a.innerHTML=bosEkran();return}
  a.innerHTML=SEKME==="ihtimal"?ihtimalEkran(w):SEKME==="kolon"?kolonEkran(w):SEKME==="arsiv"?arsivEkran():takipEkran(w);
}
function bosEkran(){const L=erisimler();
  if(YUKLENIYOR&&!Object.keys(W).length)return `<div class="card empty"><b>Yükleniyor…</b>Kolonlar ve sonuçlar getiriliyor.</div>`;
  if(!L.length)return `<div class="card empty"><b>Hoş geldin</b>Bu sayfa sana gönderilen kişiye özel bağlantıyla açılır. Bağlantıyı aç ya da aşağıya yapıştır.
    <div class="row" style="margin-top:14px;justify-content:center"><input id="kodGir" class="btn" style="flex:1;min-width:0;font-weight:400" placeholder="Bağlantıyı yapıştır"><button class="btn pri" id="kodEkle">Ekle</button></div></div>`;
  const sorun=L.filter(e=>e.durum&&e.durum!=="ok");
  return `<div class="card empty"><b>Henüz yayınlanmış kolon yok</b>${sorun.length?sorun.map(e=>esc(erisimSorun(e))).join("<br>"):"Bilgisayardaki Toto Masası'nda <b>Sonuç takibi → 📱 Telefona yayınla</b> ile kolonlar buraya gelir."}</div>`}
function kupSecici(w){const K=kuponlar(w);return K.length>1?`<div class="chips">${["hepsi",...K.map(k=>k.ad)].map(a=>`<button class="chip ${(KSEC==="hepsi"?"hepsi":KSEC)===a||(a==="hepsi"&&!K.find(k=>k.ad===KSEC))?"on":""}" data-k="${esc(a)}">${a==="hepsi"?`Hepsi (${K.length})`:esc(a)}</button>`).join("")}</div>`:""}
/* ---------- yardımcılar: kolon dağılımı = yüzdeler, ihtimal simülasyonu */
let SEN={},IHT={},SECIM={},IFILTRE="12";
function hepsiKol(K){return K.flatMap(k=>k.kolonlar)}
function yuzdeTahmin(cs){const P=Array.from({length:15},()=>[0,0,0]);cs.forEach(c=>{for(let i=0;i<15;i++)P[i][O.indexOf(c[i])]++});return P.map(a=>{const t=a[0]+a[1]+a[2]||1;return a.map(x=>x/t)})}
function sansSay(cs,son){const r={12:0,13:0,14:0,15:0};cs.forEach(c=>{const t=kolonOz(c,son).tavan;if(t>=12)r[12]++;if(t>=13)r[13]++;if(t>=14)r[14]++;if(t>=15)r[15]++});return r}
function bilenSay(cs,son){const r={12:0,13:0,14:0,15:0};cs.forEach(c=>{const d=kolonOz(c,son).d;if(d>=12)r[Math.min(d,15)]++});return r}
function ihtimal(cs,son,anahtar){if(IHT[anahtar])return IHT[anahtar];
  const P=yuzdeTahmin(cs),N=cs.length,acik=son.map((s,i)=>s?-1:i).filter(i=>i>=0);
  const taban=new Int8Array(N);cs.forEach((c,j)=>{let d=0;for(let i=0;i<15;i++)if(son[i]&&c[i]===son[i])d++;taban[j]=d});
  const L=acik.map(i=>{const a=[[],[],[]];cs.forEach((c,j)=>a[O.indexOf(c[i])].push(j));return a.map(x=>Int32Array.from(x))});
  const sim=Math.round(Math.min(20000,Math.max(3000,6e6/Math.max(1,N*Math.max(1,acik.length))))),ust=[0,0,0,0],h=new Int8Array(N);
  for(let s=0;s<sim;s++){h.set(taban);
    for(let q=0;q<acik.length;q++){const p=P[acik[q]],u=Math.random(),o=u<p[0]?0:u<p[0]+p[1]?1:2;const l=L[q][o];for(let z=0;z<l.length;z++)h[l[z]]++}
    let mx=0;for(let j=0;j<N;j++)if(h[j]>mx)mx=h[j];for(let t=0;t<4;t++)if(mx>=12+t)ust[t]++}
  return IHT[anahtar]={p:ust.map(v=>v/sim),sim}}
const yz=x=>x==null?"—":x<=0?"%0":x<0.001?"<%0,1":"%"+(x*100).toLocaleString("tr-TR",{maximumFractionDigits:x<0.1?1:0});
function dortKutu(baslik,degerler,alt,vurgu){return `<div class="small muted" style="margin:12px 0 6px">${baslik}</div><div class="tiles4">${[12,13,14,15].map((b,i)=>`<div class="tile ${vurgu&&degerler[i]&&degerler[i]!=="0"&&degerler[i]!=="%0"?"ok":""}"><div class="l">${b}${b<15?"+":""}</div><div class="v">${degerler[i]}</div></div>`).join("")}</div>${alt?`<div class="small muted" style="margin-top:6px">${alt}</div>`:""}`}
function macDurumu(w,i){const d=(w.durum||[])[i]||"",s=(w.sonuclar||[])[i];if(s||/^bitti/i.test(d))return"bitti";return d?"suruyor":"baslamadi"}
function skor(w,i){const d=(w.durum||[])[i]||"";const m=d.split("/");return m.length>1?m[1].trim():""}

/* ---------- Sonuç takibi (sade) */
function takipEkran(w){
  const son=(w.sonuclar||Array(15).fill(null)).slice(),K=secili(w),cs=hepsiKol(K),o=ozet(K,son),tut=o.n*KF,bitti=o.biten===15;
  const kz=bitti?kazanc(w,o.bilen):null,sans=sansSay(cs,son);
  let h=kupSecici(w);
  h+=`<div class="card"><h2>${esc(KSEC==="hepsi"&&K.length>1?"Tüm ekipler":K.length===1?K[0].ad:"Tüm ekipler")}<span class="s num">${o.n} kolon · ${tl(tut)}</span></h2>
    <div class="tiles">
      <div class="tile ${o.biten&&o.en>=12?"ok":""}"><div class="l">Şu an en iyi</div><div class="v">${o.biten?o.en:"—"}<small> / ${o.biten}</small></div><div class="small muted">biten maç ${o.biten}/15</div></div>
      <div class="tile"><div class="l">${bitti?"Kazanç":"Kalan maç"}</div><div class="v">${bitti?(kz!=null?tl(kz):"—"):15-o.biten}</div><div class="small muted">${bitti?(kz!=null?`net ${tl(kz-tut)}`:"ikramiye bekleniyor"):"sonuç bekleniyor"}</div></div>
    </div>
    ${bitti?dortKutu("Bilen kolon sayısı",[12,13,14,15].map(b=>String(bilenSay(cs,son)[b])),"",true)
      :dortKutu("Bilme şansı olan kolon sayısı",[12,13,14,15].map(b=>String(sans[b])),"Biten maçlara göre o sayıya hâlâ ulaşabilen kolonlar.",true)+
       dortKutu("Bilme ihtimali (en az bir kolonun)",ihtimal(cs,son,"t|"+w.id+"|"+KSEC+"|"+son.map(x=>x||"-").join("")).p.map(yz),"Biten maçlar sabit; kalan maçlar kolonlarındaki 1/X/2 dağılımına (yani yüzdelerine) göre.",true)}
    ${K.length>1?`<div class="small" style="margin-top:12px;display:grid;gap:4px">${K.map(k=>{const s2=sansSay(k.kolonlar,son),x=ozet([k],son);return `<div class="row" style="justify-content:space-between"><span>${esc(k.ad)}</span><span class="num muted">${k.kolonlar.length} kolon · en iyi ${x.biten?x.en:"—"} · 12+ şansı ${s2[12]}</span></div>`}).join("")}</div>`:""}
  </div>`;
  h+=`<div class="card"><h2>Maçlar</h2>${(w.maclar||Array(15).fill("")).map((ad,i)=>{const s=son[i],n=cs.length,dur=macDurumu(w,i);
      const tut=s&&n?cs.filter(c=>c[i]===s).length/n:null;
      return `<div class="mac"><div class="no">${i+1}</div><div class="ad"><b>${esc(ad||`${i+1}. maç`)}</b><div class="small muted">${macDurum(w,i)}${tut!=null?` · kolonların <b style="color:var(${tut>=.5?"--ok":"--bad"})">%${Math.round(tut*100)}</b>'i tuttu`:""}</div></div>
        <div>${s?`<span class="k k${s}" style="width:30px;height:28px">${s}</span>`:dur==="suruyor"?'<span class="pill warn">oynanıyor</span>':'<span class="muted small">—</span>'}</div></div>`}).join("")}</div>`;
  return h}

/* ---------- İhtimaller: elle seçim (ya böyle olursa) */
function secim(w){if(!SECIM[w.id])SECIM[w.id]=(w.sonuclar||Array(15).fill(null)).slice();return SECIM[w.id]}
function ihtimalEkran(w){
  const sec=secim(w),K=secili(w),cs=hepsiKol(K),sayi=sec.filter(Boolean).length,sans=sansSay(cs,sec);
  const anahtar="i|"+w.id+"|"+KSEC+"|"+sec.map(x=>x||"-").join("");
  let h=kupSecici(w);
  h+=`<div class="card"><h2>Ya böyle olursa?<span class="s">${sayi}/15 maç seçili</span></h2>
    <div class="small muted">Her maça istediğin sonucu seç: bitmiş, oynanan ya da başlamamış fark etmez. Gerçek sonuçlar değişmez, bu sadece deneme.</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="ihGercek">Gerçek sonuçlarla doldur</button><button class="btn" id="ihTemiz">Temizle</button></div>
    ${sayi===15?dortKutu("Bu sonuçlarla bilen kolon sayısı",[12,13,14,15].map(b=>String(bilenSay(cs,sec)[b])),"",true)
      :dortKutu("Bilme şansı olan kolon sayısı",[12,13,14,15].map(b=>String(sans[b])),"Seçtiğin sonuçlarla o sayıya hâlâ ulaşabilen kolonlar.",true)+
       dortKutu("Bilme ihtimali (en az bir kolonun)",ihtimal(cs,sec,anahtar).p.map(yz),"Seçmediğin maçlar kolonlarındaki dağılıma (yüzdelerine) göre.",true)}
  </div>`;
  h+=`<div class="card"><h2>Maçlar<span class="s">dokunarak seç, tekrar dokununca kalkar</span></h2>${(w.maclar||Array(15).fill("")).map((ad,i)=>{const g=(w.sonuclar||[])[i],dur=macDurumu(w,i);
    return `<div class="mac"><div class="no">${i+1}</div><div class="ad"><b>${esc(ad||`${i+1}. maç`)}</b><div class="small muted">${dur==="bitti"?`bitti${g?` · gerçek: ${g}`:""}${skor(w,i)?" · "+esc(skor(w,i)):""}`:dur==="suruyor"?"oynanıyor "+esc(skor(w,i)):esc((w.tarih||[])[i]||"başlamadı")}</div></div>
      <div class="sbs">${[..."1X2"].map(x=>`<button class="sb s${x} ${sec[i]===x?"on":""}" data-i="${i}" data-o="${x}" aria-label="${i+1}. maç ${x}">${x}</button>`).join("")}</div></div>`}).join("")}</div>`;
  /* seçime göre kolonlar */
  const esik={"12":12,"13":13,"14":14,"15":15}[IFILTRE]||12;
  const R=[];K.forEach(k=>k.kolonlar.forEach((c,j)=>{const o=kolonOz(c,sec);if(o.tavan>=esik)R.push({ad:k.ad,no:j+1,c,...o})}));
  R.sort((a,b)=>b.d-a.d||a.no-b.no);
  h+=`<div class="card"><h2>Şansı olan kolonlar</h2>
    <div class="chips" style="margin-bottom:8px">${["12","13","14","15"].map(x=>`<button class="chip fz ${IFILTRE===x?"on":""}" data-f="${x}">${x}${x!=="15"?"+":""} (${sans[+x]})</button>`).join("")}</div>
    ${R.length?`<div class="tbl"><table><thead><tr><th>Kolon</th>${Array.from({length:15},(_,i)=>`<th>${i+1}</th>`).join("")}<th>D</th><th>T</th></tr></thead><tbody>
      ${R.slice(0,50).map(r=>`<tr><td style="text-align:left">${K.length>1?`<span class="muted small">${esc(r.ad)} </span>`:""}K${r.no}</td>${[...r.c].map((x,i)=>`<td class="h ${sec[i]?(sec[i]===x?"d":"y"):""}">${x}</td>`).join("")}<td><b>${r.d}</b></td><td>${r.tavan}</td></tr>`).join("")}
      </tbody></table></div>${R.length>50?`<div class="small muted" style="margin-top:6px">${R.length} kolon · en çok bilen 50'si gösteriliyor; hepsi için Kolonlar sekmesi</div>`:""}`:'<div class="small muted">Bu seçimle bu sayıya ulaşabilen kolon yok.</div>'}</div>`;
  h+=senaryoKart(w,K,sec)+etkiKart(w,K,sec);
  return h}

/* ---------- senaryolar ve maç maç etki (İhtimaller sekmesinde) */
function etki(K,son){const cs=K.flatMap(k=>k.kolonlar),yan=cs.map(c=>kolonOz(c,son).y),R=[];
  son.forEach((s,i)=>{if(s)return;const v=[..."1X2"].map(o=>{let t12=0,t13=0,tav=0;cs.forEach((c,j)=>{const t=15-yan[j]-(c[i]===o?0:1);if(t>=12)t12++;if(t>=13)t13++;if(t>tav)tav=t});return {o,t12,t13,tav}});
    R.push({i,v,fark:Math.max(...v.map(x=>x.t12))-Math.min(...v.map(x=>x.t12))})});return R}

function senaryoAnahtar(w,son){return w.id+"|"+KSEC+"|"+son.map(x=>x||"-").join("")}
function senaryoHesapla(K,son){
  const kal=son.map((s,i)=>s?-1:i).filter(i=>i>=0),k=kal.length,m=new Map();
  K.forEach(kp=>kp.kolonlar.forEach(c=>{const d0=kolonOz(c,son).d,p=kal.map(i=>c[i]).join("");if(!(m.get(p)>=d0))m.set(p,d0)}));
  const P=[...m].map(([p,d0])=>({a:[...p].map(x=>O.indexOf(x)),d0})).sort((a,b)=>b.d0-a.d0);
  const toplam=3**k,ornek=toplam*P.length*Math.max(k,1)>4e7,n=ornek?20000:toplam,dag={},s=new Array(k);let enKotu=null;
  for(let t=0;t<n;t++){
    if(ornek){for(let j=0;j<k;j++)s[j]=Math.floor(Math.random()*3)}else{let x=t;for(let j=0;j<k;j++){s[j]=x%3;x=(x/3)|0}}
    let best=0;for(const q of P){if(q.d0+k<=best)break;let d=q.d0;const a=q.a;for(let j=0;j<k;j++)if(a[j]===s[j])d++;if(d>best){best=d;if(best===15)break}}
    dag[best]=(dag[best]||0)+1;if(!enKotu||best<enKotu.b)enKotu={b:best,s:s.slice()}}
  const bq=P.reduce((a,q)=>q.d0>a.d0?q:a,P[0]);
  return {k,kal,n,ornek,dag,enIyi:{b:bq.d0+k,s:bq.a.slice()},enKotu}}
function senaryoKart(w,K,son){const kal=son.filter(x=>!x).length;if(!kal||!K.length)return "";
  const r=SEN[senaryoAnahtar(w,son)];
  let h=`<div class="card"><h2>Senaryolar<span class="s">kalan ${kal} maçın bütün sonuç dizileri</span></h2>`;
  if(!r)return h+`<div class="small muted" style="margin-bottom:10px">${kal} maç kaldı, yani ${(3**kal).toLocaleString("tr-TR")} farklı sonuç dizisi var. Her birinde en iyi kolonunun kaç bildiği sayılır.</div><button class="btn pri" id="senBtn">Senaryoları hesapla</button></div>`;
  const ge=b=>Object.entries(r.dag).filter(([d])=>+d>=b).reduce((a,[,n])=>a+n,0),pct=x=>{const p=100*x/r.n;return p>0&&p<1?"<1":Math.round(p)};
  const yol=x=>x.s.map((v,j)=>`<span style="display:inline-flex;flex-direction:column;align-items:center;gap:1px"><span class="small muted num">${r.kal[j]+1}</span><span class="k k${O[v]}">${O[v]}</span></span>`).join("");
  return h+`<div class="tiles">${[15,14,13,12].map(b=>`<div class="tile ${ge(b)?"ok":""}"><div class="l">${b}${b<15?"+":""} bilinen dizi</div><div class="v">%${pct(ge(b))}</div><div class="small muted num">${ge(b).toLocaleString("tr-TR")} / ${r.n.toLocaleString("tr-TR")}${r.ornek?" deneme":""}</div></div>`).join("")}</div>
    <div style="margin-top:12px;display:grid;gap:10px">
      <div><div class="small"><b>En iyi yol</b> · en iyi kolon <b>${r.enIyi.b}</b> bilir</div><div class="row" style="gap:4px;margin-top:4px">${yol(r.enIyi)}</div></div>
      <div><div class="small"><b>En kötü yol</b> · en iyi kolon <b>${r.enKotu.b}</b> bilir</div><div class="row" style="gap:4px;margin-top:4px">${yol(r.enKotu)}</div></div></div>
    <div class="small muted" style="margin-top:10px">Her sonuç eşit sayılır, favori/sürpriz farkı yoktur: yüzde "kaç ihtimalde" demektir, gerçek olasılık değildir.${r.ornek?" Dizi sayısı çok fazla olduğu için 20.000 rastgele dizi denendi; en kötü yol yaklaşıktır.":""}</div></div>`}
function etkiKart(w,K,son){if(!K.length)return "";const E=etki(K,son);if(!E.length)return "";E.sort((a,b)=>b.fark-a.fark||a.i-b.i);
  return `<div class="card"><h2>Maç maç etkisi<span class="s">en kritik maç üstte</span></h2><div class="tbl"><table class="et"><thead><tr><th style="text-align:left">Maç</th><th><span class="k k1">1</span></th><th><span class="k kX">X</span></th><th><span class="k k2">2</span></th></tr></thead><tbody>
    ${E.map(e=>`<tr><td style="text-align:left;max-width:84px;overflow:hidden;text-overflow:ellipsis;padding-right:6px">${e.i+1}. ${esc((w.maclar||[])[e.i]||"")}</td>${e.v.map(x=>`<td style="background:var(${x.t12?"--ok-soft":"--bad-soft"})"><b style="color:var(${x.t12?"--ok":"--bad"});font-size:15px">${x.t12}</b><div class="muted" style="font-size:11px">13+ ${x.t13} · T${x.tav}</div></td>`).join("")}</tr>`).join("")}
    </tbody></table></div><div class="small muted" style="margin-top:6px">Büyük sayı: o sonuç gelirse 12+ şansı kalan kolon sayısı. 13+: 13 şansı kalan. T: tavan. Kritik maç: sonuca göre farkın en büyük olduğu maç.</div></div>`}
function kolonEkran(w){
  const son=(w.sonuclar||Array(15).fill(null)).slice(),K=secili(w);let R=[];
  K.forEach(k=>k.kolonlar.forEach((c,j)=>{const o=kolonOz(c,son);R.push({ad:k.ad,no:j+1,c,...o})}));
  if(["12","13","14","15"].includes(FILTRE))R=R.filter(r=>r.tavan>=+FILTRE);
  if(ARA){const q=ARA.toUpperCase().replace(/\s/g,"");R=R.filter(r=>("K"+r.no)===q||r.c.includes(q))}
  R.sort((a,b)=>b.d-a.d||b.tavan-a.tavan||a.no-b.no);
  const goster=R.slice(0,300);
  return `${kupSecici(w)}<div class="card"><div class="row" style="margin-bottom:10px">
      <select id="filtre" class="btn" aria-label="Filtre"><option value="hepsi" ${FILTRE==="hepsi"?"selected":""}>Tüm kolonlar</option><option value="12" ${FILTRE==="12"?"selected":""}>12+ şansı olanlar</option><option value="13" ${FILTRE==="13"?"selected":""}>13+ şansı olanlar</option><option value="14" ${FILTRE==="14"?"selected":""}>14+ şansı olanlar</option><option value="15" ${FILTRE==="15"?"selected":""}>15 şansı olanlar</option></select>
      <input id="ara" class="btn" style="flex:1;min-width:120px;font-weight:400" placeholder="Ara: K15 ya da 1X2…" value="${esc(ARA)}"></div>
    <div class="small muted" style="margin-bottom:6px">${R.length} kolon${R.length>300?" · ilk 300 gösteriliyor":""} · en çok doğru bilen üstte</div>
    <div class="tbl"><table><thead><tr><th>Kolon</th>${Array.from({length:15},(_,i)=>`<th>${i+1}</th>`).join("")}<th>D</th><th>Tavan</th></tr></thead><tbody>
    ${goster.map(r=>`<tr><td style="text-align:left">${K.length>1?`<span class="muted small">${esc(r.ad)} </span>`:""}K${r.no}</td>${[...r.c].map((x,i)=>`<td class="h ${son[i]?(son[i]===x?"d":"y"):""}">${x}</td>`).join("")}<td><b>${r.d}</b></td><td style="color:var(${r.tavan>=12?"--ok":"--muted"})">${r.tavan}</td></tr>`).join("")}
    </tbody></table></div></div>`}
function arsivEkran(){
  const w=hafta();if(!w)return bosEkran();
  const son=w.sonuclar||[],K=kuponlar(w),cs=hepsiKol(K),o=ozet(K,son),tut=o.n*KF,kz=o.biten===15?kazanc(w,o.bilen):null;
  const idx=(w.maclar||[]).map((_,i)=>i),bas=idx.filter(i=>macDurumu(w,i)!=="baslamadi"),bek=idx.length-bas.length;
  return `<div class="card"><h2>${esc(w.ad||w.aralik)}<span class="s">${o.biten}/15 maç bitti</span></h2>
    <div class="small num">${o.biten===15?`en iyi <b>${o.en}</b>${Object.keys(o.bilen).length?" · "+Object.entries(o.bilen).sort((a,b)=>b[0]-a[0]).map(([b,n])=>`${b} bilen ×${n}`).join(", "):""}${kz!=null?` · <span class="pill ${kz>=tut?"ok":"bad"}">${kz>=tut?"+":""}${tl(kz-tut)}</span>`:""}`:`şu an en iyi ${o.biten?o.en:"—"} · ${o.n} kolon`}</div></div>
    <div class="card"><h2>Başlayan ve biten maçlar</h2>${bas.length?bas.map(i=>{const s=son[i],dur=macDurumu(w,i),tutan=s&&cs.length?cs.filter(c=>c[i]===s).length/cs.length:null;
      return `<div class="mac"><div class="no">${i+1}</div><div class="ad"><b>${esc((w.maclar||[])[i]||"")}</b><div class="small muted">${esc((w.tarih||[])[i]||"")}${skor(w,i)?" · <b>"+esc(skor(w,i))+"</b>":""}${tutan!=null?` · kolonların %${Math.round(tutan*100)}'i`:""}</div></div>
        <div>${dur==="bitti"&&s?`<span class="k k${s}" style="width:30px;height:28px">${s}</span>`:'<span class="pill warn">oynanıyor</span>'}</div></div>`}).join(""):'<div class="small muted">Henüz başlayan maç yok.</div>'}
      ${bek?`<div class="small muted" style="margin-top:8px">${bek} maç henüz başlamadı.</div>`:""}</div>`}

  <label class="field">Yeni bağlantı ekle<input id="kodGir2" placeholder="Bağlantıyı yapıştır"></label>

  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="kapat()">Kapat</button><button class="btn pri" id="kodEkle2">Ekle</button></div>`);

  if(erisimEkle(e))toast("Bağlantı eklendi.");else toast("Bu bağlantı zaten kayıtlı.");kapat();yenile(false)}
document.addEventListener("click",e=>{if(e.target.id==="kodEkle")kodEkle($("#kodGir").value)});
